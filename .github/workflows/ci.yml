name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      # No DATABASE_URL here, so the Postgres suites skip; everything else runs.
      - run: npm test
      - run: npm run build
